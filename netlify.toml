# Plaroots サイト設定
[build]
  publish = "."

# 社内用メモ（_internal フォルダ）は公開しない
[[redirects]]
  from = "/_internal/*"
  to = "/404.html"
  status = 404
  force = true

# セキュリティの基本ヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 画像は長めにキャッシュ
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
