<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>お問い合わせありがとうございます｜プラルーツ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7D9471">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><circle cx=%22100%22 cy=%22100%22 r=%2288%22 stroke=%22%23A9773F%22 stroke-width=%2214%22 fill=%22none%22/><circle cx=%22100%22 cy=%22100%22 r=%2258%22 stroke=%22%23C79A5E%22 stroke-width=%2214%22 fill=%22none%22/><circle cx=%22100%22 cy=%22100%22 r=%2228%22 stroke=%22%237D9471%22 stroke-width=%2214%22 fill=%22none%22/><circle cx=%22100%22 cy=%22100%22 r=%228%22 fill=%22%235C7253%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F5;--card:#FFFFFF;--sage:#7D9471;--sage-deep:#5C7253;--sage-pale:#EDF1E9;
    --ink:#3B382F;--sub:#8B8477;--line:#EAE4D7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;
    font-size:15px;line-height:1.85;display:flex;flex-direction:column;min-height:100vh;
    -webkit-font-smoothing:antialiased}
  h1,h2{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;line-height:1.5}
  a{color:inherit;text-decoration:none}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 22px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:32px;
    padding:52px 38px;max-width:620px;text-align:center}
  .mark{width:78px;height:78px;border-radius:50%;background:var(--sage-pale);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px}
  h1{font-size:clamp(22px,3.6vw,29px);margin-bottom:18px}
  .lead{color:var(--sub);font-size:14.5px;margin-bottom:28px}
  .info{background:var(--sage-pale);border-radius:18px;padding:20px 22px;text-align:left;
    font-size:13.5px;color:var(--sub);line-height:1.85;margin-bottom:28px}
  .info b{color:var(--sage-deep)}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;padding:13px 28px;
    transition:transform .18s ease,background .2s ease}
  .btn-fill{background:var(--sage);color:#fff}
  .btn-fill:hover{background:var(--sage-deep);transform:translateY(-2px)}
  .btn-line{background:transparent;color:var(--sage-deep);border:1.5px solid var(--sage)}
  .btn-line:hover{background:var(--sage-pale)}
  footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--sub);font-size:12.5px}
  :focus-visible{outline:2.5px solid var(--sage);outline-offset:3px;border-radius:6px}
</style>

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">

<style>
  /* Phosphor icon defaults */
  i[class^="ph"],i[class*=" ph"]{display:inline-block;line-height:1;vertical-align:middle}
  .ic i{font-size:24px;color:var(--sage-deep)}
  .svc .ic i,.entry .ic i,.point .ic i,.cap .ic i{font-size:23px;color:var(--sage-deep)}
  .pillar .ic i{font-size:26px;color:var(--sage-deep)}
  .obox h4 i,.carebox h4 i,.play h4 i,.optlabel i{font-size:19px;color:var(--sage);vertical-align:-3px}
  .mk .badge i{font-size:24px}
  .toc h2 i{font-size:19px;color:var(--sage);vertical-align:-3px}
  .safenote i{font-size:16px;color:var(--sage);vertical-align:-2px}
  h4 i,h2 i,h1 i{color:var(--sage)}
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="mark"><i class="ph-duotone ph-plant" aria-hidden="true"></i></div>
    <h1>お問い合わせ、<br>ありがとうございます。</h1>
    <p class="lead">内容を確認のうえ、担当者より2営業日以内にご返信いたします。</p>
    <div class="info">
      <b>ご返信までしばらくお待ちください。</b><br>
      2営業日を過ぎても返信が届かない場合は、迷惑メールフォルダをご確認いただくか、
      お手数ですが uwa0502@outlook.jp まで直接ご連絡ください。
    </div>
    <div class="btns">
      <a class="btn btn-fill" href="index.html">ホームに戻る</a>
      <a class="btn btn-line" href="../kodomo-shop/index.html">オンラインショップを見る</a>
    </div>
  </div>
</main>
<footer>© 2026 プラルーツ</footer>
</body>
</html>
